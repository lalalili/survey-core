name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要發布的 semver tag，例如 v1.1.3'
        required: true
        type: string
      sha:
        description: '要發布的完整 40 字元 main commit SHA'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: lalalili/.github/.github/workflows/php-package-validated-release.yml@main
    secrets:
      satis-dispatch-token: ${{ secrets.SATIS_DISPATCH_TOKEN }}
    with:
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      php-extensions: 'dom, mbstring, pdo_sqlite, sockets, zip'
      run-browser: true
      run-validate: false

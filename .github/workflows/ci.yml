name: CI

on: [push, pull_request]

jobs:
  ci:
    uses: lalalili/.github/.github/workflows/php-package-ci.yml@main
    secrets: inherit
    with:
      php-versions: "['8.4']"
      php-extensions: 'dom, mbstring, pdo_sqlite, sockets, zip'
      run-browser: true
      run-validate: false

  # 公開填答頁的顯示條件求值有一份 JavaScript 實作（condition-evaluator partial），
  # 與 PHP 權威實作 ConditionGroupEvaluator 的一致性由 vitest 把關。
  js:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test
